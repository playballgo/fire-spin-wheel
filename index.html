<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>火花輪盤 - 線上抽籤隨機決定器</title>
    <meta name="description" content="火花輪盤是一個華麗的線上抽籤工具，具備動態煙火特效，適合小組抽籤、決定晚餐或活動遊戲使用。">
    <meta name="keywords" content="火花輪盤, 抽籤輪盤, 隨機抽籤, 煙火效果, 幸運輪盤">
    <meta property="og:title" content="火花輪盤 - 決定命運的時候到了">
    <meta property="og:description" content="帶有煙火效果的華麗抽籤輪盤">
    <meta property="og:type" content="website">
    <style>
        body {
            font-family: "Microsoft JhengHei", -apple-system, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            background-color: #0d0d15;
            color: white;
            margin: 0;
            padding: 40px 20px;
            overflow: hidden;
        }

        #fireworks-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 999;
            background: transparent;
        }

        /* 核心佈局：輪盤左，控制台右 */
        .container {
            display: flex;
            flex-direction: row; /* 水平排列 */
            gap: 60px;
            max-width: 1200px;
            width: 100%;
            align-items: center;
            justify-content: center;
            position: relative;
            z-index: 10;
        }

        .wheel-box {
            position: relative;
            user-select: none;
            flex-shrink: 0; /* 防止輪盤被擠壓 */
        }

        /* 金色指針 */
        .wheel-box::after {
            content: "";
            position: absolute;
            top: -20px;
            left: 50%;
            transform: translateX(-50%);
            border-left: 25px solid transparent;
            border-right: 25px solid transparent;
            border-top: 50px solid #ffd700;
            filter: drop-shadow(0 5px 15px rgba(255,215,0,0.5));
            z-index: 20;
        }

        canvas#wheel {
            background: #fff;
            border-radius: 50%;
            box-shadow: 0 0 50px rgba(0,0,0,0.8);
            transition: transform 6s cubic-bezier(0.1, 0.8, 0.1, 1);
            border: 12px solid #222;
        }

        .control-panel {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(15px);
            padding: 30px;
            border-radius: 24px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.5);
            width: 100%;
            max-width: 400px; /* 限制控制區寬度 */
            border: 1px solid rgba(255,255,255,0.1);
        }

        h1 {
            margin-bottom: 30px;
            text-shadow: 0 5px 15px rgba(0,0,0,0.5);
        }

        textarea {
            width: 100%;
            height: 250px;
            background: rgba(0,0,0,0.5);
            color: #fff;
            padding: 15px;
            box-sizing: border-box;
            border: 1px solid #333;
            border-radius: 12px;
            font-size: 18px;
            margin-bottom: 20px;
            outline: none;
            line-height: 1.5;
        }

        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        button {
            width: 100%;
            padding: 16px;
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        .btn-spin { background: linear-gradient(135deg, #ff416c, #ff4b2b); }
        .btn-quick { background: #2c3e50; color: #bdc3c7; font-size: 14px; }
        
        button:hover { transform: scale(1.02); filter: brightness(1.1); }

        .result-display { margin-top: 25px; text-align: center; height: 50px; }
        #result { font-size: 36px; font-weight: 900; color: #00d2ff; }

        /* 手機版自動切換回垂直佈局 */
        @media (max-width: 850px) {
            .container { flex-direction: column; gap: 30px; }
            body { overflow-y: auto; }
        }
    </style>
</head>
<body>

    <canvas id="fireworks-canvas"></canvas>
    <h1>🎡 決定命運的時候到了</h1>

    <div class="container">
        <div class="wheel-box">
            <canvas id="wheel" width="500" height="500"></canvas>
        </div>

        <div class="control-panel">
            <textarea id="options">
小組 1
小組 2
小組 3
小組 4
小組 5
小組 6</textarea>
            
            <div class="btn-group">
                <button class="btn-spin" onclick="spin(false)">命運旋轉</button>
                <button class="btn-quick" onclick="spin(true)">快速結果</button>
            </div>

            <div class="result-display">
                <div id="result"></div>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('wheel');
        const ctx = canvas.getContext('2d');
        const textarea = document.getElementById('options');
        const resultDiv = document.getElementById('result');
        
        let currentRotation = 0;
        let isSpinning = false;
        const colors = ["#FF3D67", "#3498db", "#FBC02D", "#4CAF50", "#9C27B0", "#FB8C00", "#00BCD4", "#E91E63"];

        function drawWheel() {
            const items = textarea.value.split('\n').filter(i => i.trim() !== "");
            if (items.length === 0) return;
            const arcSize = (2 * Math.PI) / items.length;
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            items.forEach((text, i) => {
                const angle = i * arcSize;
                ctx.beginPath();
                ctx.fillStyle = colors[i % colors.length];
                ctx.moveTo(250, 250);
                ctx.arc(250, 250, 245, angle, angle + arcSize);
                ctx.fill();
                ctx.save();
                ctx.translate(250, 250);
                ctx.rotate(angle + arcSize / 2);
                ctx.textAlign = "right";
                ctx.fillStyle = "white";
                ctx.font = "bold 20px sans-serif";
                ctx.fillText(text, 230, 10);
                ctx.restore();
            });
        }

        function spin(isQuick) {
            if (isSpinning) return;
            const items = textarea.value.split('\n').filter(i => i.trim() !== "");
            if (items.length < 2) return alert("請輸入至少兩個選項");

            isSpinning = true;
            resultDiv.innerText = isQuick ? "" : "祝你好運...";
            
            const extraDegree = Math.floor(Math.random() * 360);
            const totalSpins = (isQuick ? 0 : 10 * 360) + extraDegree; 
            currentRotation += totalSpins;

            if (isQuick) {
                canvas.style.transition = "none";
                canvas.style.transform = `rotate(${currentRotation}deg)`;
                canvas.offsetHeight; 
                canvas.style.transition = "transform 6s cubic-bezier(0.1, 0.8, 0.1, 1)";
                showResult(items);
            } else {
                canvas.style.transform = `rotate(${currentRotation}deg)`;
                setTimeout(() => showResult(items), 6000);
            }
        }

        function showResult(items) {
            isSpinning = false;
            const actualDegree = (360 - (currentRotation % 360) + 270) % 360;
            const index = Math.floor(actualDegree / (360 / items.length));
            resultDiv.innerText = "⭐ " + items[index % items.length];
            launchFireworks();
        }

        // --- 煙火動畫 ---
        const fwCanvas = document.getElementById('fireworks-canvas');
        const fwCtx = fwCanvas.getContext('2d');
        let particles = [];
        function resizeFw() { fwCanvas.width = window.innerWidth; fwCanvas.height = window.innerHeight; }
        window.addEventListener('resize', resizeFw);
        resizeFw();

        class Particle {
            constructor(x, y, color) {
                this.x = x; this.y = y; this.color = color;
                const angle = Math.random() * Math.PI * 2;
                const force = Math.random() * 15 + 5; 
                this.velocity = { x: Math.cos(angle) * force, y: Math.sin(angle) * force };
                this.alpha = 1; this.friction = 0.95; this.gravity = 0.12;
            }
            draw() {
                fwCtx.save();
                fwCtx.globalAlpha = this.alpha;
                fwCtx.beginPath(); 
                fwCtx.arc(this.x, this.y, Math.random() * 4 + 1, 0, Math.PI * 2);
                fwCtx.fillStyle = this.color; 
                fwCtx.shadowBlur = 15;
                fwCtx.shadowColor = this.color;
                fwCtx.fill();
                fwCtx.restore();
            }
            update() {
                this.velocity.x *= this.friction; this.velocity.y *= this.friction;
                this.velocity.y += this.gravity; this.x += this.velocity.x; this.y += this.velocity.y;
                this.alpha -= 0.01;
            }
        }

        function launchFireworks() {
            for(let i=0; i<10; i++) {
                setTimeout(() => {
                    const x = (Math.random() * 0.8 + 0.1) * fwCanvas.width;
                    const y = (Math.random() * 0.5 + 0.1) * fwCanvas.height;
                    const color = `hsl(${Math.random() * 360}, 100%, 60%)`;
                    for(let j=0; j<120; j++) particles.push(new Particle(x, y, color));
                }, i * 150);
            }
        }

        function animate() {
            requestAnimationFrame(animate);
            fwCtx.clearRect(0, 0, fwCanvas.width, fwCanvas.height);
            particles.forEach((p, i) => { 
                if (p.alpha <= 0) particles.splice(i, 1);
                else { p.update(); p.draw(); }
            });
        }

        textarea.addEventListener('input', drawWheel);
        drawWheel();
        animate();
    </script>
</body>
</html>
